{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AX Evaluator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-semibold mb-0" href="/">AX Evaluator</a>
      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          {% if user.is_staff %}
            <a class="text-decoration-none" href="{% url 'tutor_rounds' %}">회차 관리</a>
            <a class="btn btn-outline-primary btn-sm" href="/admin/">Admin</a>
          {% else %}
            <a class="text-decoration-none" href="{% url 'student_home' %}">학생 홈</a>
            <a class="text-decoration-none" href="{% url 'student_team' %}">내 팀</a>
            <a class="text-decoration-none" href="{% url 'student_result' %}">내 결과</a>
          {% endif %}
          <span class="text-muted small">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link btn-sm text-decoration-none p-0">로그아웃</button>
          </form>
        {% else %}
          <a class="text-decoration-none" href="{% url 'login' %}">로그인</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
