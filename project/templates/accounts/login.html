{% extends "base.html" %}
{% load socialaccount %} <!-- socialaccount 로드 추가 -->

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h4 class="card-title mb-4">로그인</h4>

        {% if form.errors %}
          <div class="alert alert-danger">
            이메일 또는 비밀번호가 올바르지 않습니다.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>

        {% get_providers as socialaccount_providers %}
        {% if socialaccount_providers %}
        <hr class="my-4">

        <!-- 구글 로그인 버튼: SocialApp이 등록된 경우에만 표시 (없으면 조용히 숨김) -->
        <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100">
          Google 계정으로 로그인
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
