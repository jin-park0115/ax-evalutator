{% extends "base.html" %}

{% block content %}

<div class="mb-4">

    <h1 class="h3 mb-1">공개 설정</h1>

    <p class="text-muted mb-0">
        평가 및 결과의 공개 여부를 설정할 수 있습니다.
    </p>

</div>

<div class="card">

    <div class="card-header">
        <strong>평가 공개 설정</strong>
    </div>

    <div class="card-body">

        <div class="form-check form-switch mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="evaluationOpen"
                {% if settings.evaluation_open %}checked{% endif %}
            >

            <label
                class="form-check-label"
                for="evaluationOpen"
            >
                평가 진행 공개
            </label>

        </div>

        <div class="form-check form-switch mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="resultOpen"
                {% if settings.result_open %}checked{% endif %}
            >

            <label
                class="form-check-label"
                for="resultOpen"
            >
                평가 결과 공개
            </label>

        </div>

        <div class="form-check form-switch mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="studentVisible"
                {% if settings.student_visible %}checked{% endif %}
            >

            <label
                class="form-check-label"
                for="studentVisible"
            >
                학생에게 평가 화면 공개
            </label>

        </div>

        <div class="form-check form-switch mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="anonymous"
                {% if settings.anonymous %}checked{% endif %}
            >

            <label
                class="form-check-label"
                for="anonymous"
            >
                익명 평가
            </label>

        </div>

        <button
            type="button"
            class="btn btn-primary"
        >
            설정 저장
        </button>

    </div>

</div>

{% endblock %}
