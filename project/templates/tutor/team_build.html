{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">팀 편성</h1>
        <p class="text-muted mb-0">
            학생을 팀별로 편성하고 확정할 수 있습니다.
        </p>
    </div>

    <div>
        <form method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" name="auto_assign" class="btn btn-primary">
        자동 편성
    </button>
</form>

        <button type="button" class="btn btn-success">
            편성 확정
        </button>
    </div>
</div>


<!-- 현재 상태 -->
<div class="alert alert-warning mb-4">
    현재 상태: <strong>편성 대기</strong>
</div>


<!-- 팀 편성 결과 -->
<div class="card">
    <div class="card-header">
        <strong>팀 편성 결과</strong>
    </div>

    <div class="card-body">

        <div class="row g-3">

            {% for team in teams %}

            <div class="col-md-4">

                <div class="card h-100">

                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong>{{ team.team_no }}팀</strong>

                        <span class="badge text-bg-secondary">
                            평균 {{ team.avg_seed }}
                        </span>
                    </div>

                    <div class="card-body">

                        <h6 class="mb-3">팀원</h6>

                        {% for member in team.members %}

                        <div class="mb-2">

                            <select class="form-select">

                                {% for student in students %}

                                <option
                                    {% if student.name == member.name %}
                                    selected
                                    {% endif %}
                                >
                                    {{ student.name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        {% endfor %}

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>
</div>

{% endblock %}
